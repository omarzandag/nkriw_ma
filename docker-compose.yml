version: '3.8'

services:
  db:
    image: postgres:15
    container_name: nkriwma_db
    environment:
      POSTGRES_DB: nkriwma
      POSTGRES_USER: nkriwma
      POSTGRES_PASSWORD: nkriwma_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: