# NKRIW.MA — full stack: PostgreSQL + FastAPI backend + React/Vite frontend (nginx)
#
#   docker compose up -d        # build & start everything
#   docker compose up -d --build
#   docker compose down -v      # stop & wipe volumes
#
# Sensible defaults are inlined via ${VAR:-default}, so this works out of the
# box. Create a ".env" (see .env.example) to override secrets / external endpoints.
# The frontend nginx reverse-proxies /api and /uploads to the backend service
# and serves the React SPA, so everything is same-origin behind one port.
name: nkriwma
services:
  # ---------------------------------------------------------------- PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: nkriwma_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nkriwma}
      POSTGRES_USER: ${POSTGRES_USER:-nkriwma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nkriwma_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(POSTGRES_USER) -d $$(POSTGRES_DB)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------------------- Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nkriwma_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Defaults match the in-compose "db" service creds above; change the
      # password in BOTH places (here and POSTGRES_PASSWORD) if you override it.
      DATABASE_URL: ${DATABASE_URL:-postgresql://nkriwma:nkriwma_password@db:5432/nkriwma}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nkriw.ma}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      UPLOAD_DIR: /data/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      # IMPORTANT: must be a JSON array string, e.g. ["http://host","https://host"].
      # A plain string here crashes pydantic-settings at startup (it json.loads).
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:80","http://localhost:8000","http://localhost:5173","https://nkriw.ma"]}'
      APP_NAME: ${APP_NAME:-NKRIW.MA}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-False}
      # SMTP (bootstrap; also overridable from the Admin Dashboard > Email Settings)
      SMTP_ENABLED: ${SMTP_ENABLED:-False}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NKRIW.MA}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-True}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-False}
      RESET_OTP_TTL_MINUTES: ${RESET_OTP_TTL_MINUTES:-10}
      RESET_OTP_MAX_ATTEMPTS: ${RESET_OTP_MAX_ATTEMPTS:-5}
    volumes:
      - uploads:/data/uploads
    expose:
      - "8000"   # reachable to other containers only (frontend nginx); not published

  # ------------------------------------------------------------------ Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nkriwma_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
  uploads:
